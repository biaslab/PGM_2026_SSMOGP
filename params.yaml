# Experiment hyperparameters for DVC pipeline.
# Run experiments via: dvc repro

partial_obs:
  # Partial observation on environmental monitoring benchmark (d=4, D=12)
  # Bliznyuk et al. (2008), Maddox et al. (NeurIPS 2021)
  # Goal: Demonstrate FFG modularity — SS-GP handles missing per-output data
  # naturally via message passing; KM-GP requires covariance restructuring
  # D=12 makes KM-GP's O((D*n_obs)^3) cost visible at moderate N
  N: 500
  d: 4
  D: 12
  Q: 6
  n_spatial: 3
  n_temporal: 4
  steps: 150
  n_seed: 10
  beta: 2.0
  R_diag_init: 0.2
  log_every: 10
  seeds: [0,1,2,3,4]
  ls: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5]
  sigma2s: [3.0, 3.0, 2.0, 2.0, 1.0, 1.0]
