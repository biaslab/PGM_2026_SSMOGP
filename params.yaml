# Experiment hyperparameters for DVC pipeline.
# Run experiments via: dvc repro

partial_obs:
  # ETTh1 forecasting under random per-feature dropout.
  # Train a multi-output state-space LMC GP on the first half of the series
  # (with i.i.d. feature dropout) and forecast the held-out second half.
  # Compares SS-LMC (message passing) vs KM-LMC (covariance restructuring) on
  # forecast MNLL/RMSE and fit+forecast time, swept over window size N and dropout p.
  data_path: data/ett/ETTh1.csv
  D: 7                          # all numeric ETT columns as outputs
  Q: 4                          # latent LMC GPs
  R_diag_init: 0.2
  Ns: [500, 1000, 2000, 4000]   # training-window sizes (split 50/50 train/forecast)
  p_fixed: 0.3                  # dropout used during the N sweep
  ps: [0.1, 0.3, 0.5, 0.7]      # dropout levels
  N_fixed: 1000                 # window used during the p sweep
  seeds: [0, 1, 2]              # dropout realizations
  ls: [4.0, 12.0, 24.0, 48.0]   # length-scales in timestep (hour) units
  sigma2s: [1.0, 1.0, 1.0, 1.0]

quadrature:
  # Bayesian Quadrature on 1D synthetic benchmark (sinusoidal latents)
  # d=1 means NN chain = natural ordering, so SS-GP is exact
  N: 200
  d: 1
  D: 6
  Q: 3
  steps: 150
  n_seed: 10
  R_diag_init: 0.1
  log_every: 5
  seeds: [0,1,2,3,4]
  ls: [1.0, 1.5, 2.0]
  sigma2s: [3.0, 2.0, 1.0]

dim_sweep:
  # Synthetic sensor-network sweep over input dimension d.
  # Each input coordinate = one weather station; the function output is a
  # spatially weighted, saturating combination of per-station readings.
  # Goal: quantify NN-chain degradation with d. Compares SS-GP vs KM-GP vs Random.
  ds: [2, 4, 8, 16, 32]
  D: 3
  Q: 2
  N: 200
  steps: 100
  n_seed: 5
  beta: 2.0
  R_diag_init: 0.1
  log_every: 20
  seeds: [0, 1, 2, 3, 4]
  ls: [1.0, 2.0]
  sigma2s: [2.0, 1.0]
