# Experiment hyperparameters for DVC pipeline.
# Run experiments via: dvc repro

partial_obs:
  # Partial observation on environmental monitoring benchmark (d=4, D=12)
  # Bliznyuk et al. (2008), Maddox et al. (NeurIPS 2021)
  # Goal: Demonstrate FFG modularity — SS-GP handles missing per-output data
  # naturally via message passing; KM-GP requires covariance restructuring
  # D=12 makes KM-GP's O((D*n_obs)^3) cost visible at moderate N
  N: 500
  d: 4
  D: 12
  Q: 6
  n_spatial: 3
  n_temporal: 4
  steps: 150
  n_seed: 10
  beta: 2.0
  R_diag_init: 0.2
  log_every: 10
  seeds: [0,1,2,3,4]
  ls: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5]
  sigma2s: [3.0, 3.0, 2.0, 2.0, 1.0, 1.0]

quadrature:
  # Bayesian Quadrature on 1D synthetic benchmark (sinusoidal latents)
  # d=1 means NN chain = natural ordering, so SS-GP is exact
  N: 200
  d: 1
  D: 6
  Q: 3
  steps: 150
  n_seed: 10
  R_diag_init: 0.1
  log_every: 5
  seeds: [0,1,2,3,4]
  ls: [1.0, 1.5, 2.0]
  sigma2s: [3.0, 2.0, 1.0]

dim_sweep:
  # Synthetic sensor-network sweep over input dimension d.
  # Each input coordinate = one weather station; the function output is a
  # spatially weighted, saturating combination of per-station readings.
  # Goal: quantify NN-chain degradation with d. Compares SS-GP vs KM-GP vs Random.
  ds: [2, 4, 8, 16, 32]
  D: 3
  Q: 2
  N: 200
  steps: 100
  n_seed: 5
  beta: 2.0
  R_diag_init: 0.1
  log_every: 20
  seeds: [0, 1, 2, 3, 4]
  ls: [1.0, 2.0]
  sigma2s: [2.0, 1.0]
