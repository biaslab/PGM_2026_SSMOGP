stages:
  partial_obs:
    cmd: julia --project=. experiments/partial_obs.jl
    deps:
      - experiments/partial_obs.jl
      - src
    params:
      - partial_obs
    outs:
      - data/partial_obs/comparison.json
      - data/partial_obs/convergence.png
      - data/partial_obs/convergence.tikz
      - data/partial_obs/timing.png
      - data/partial_obs/timing.tikz
      - data/partial_obs/timelimit.png
      - data/partial_obs/timelimit.tikz
    metrics:
      - data/partial_obs/metrics.json:
          cache: false

  ett_forecast:
    cmd: julia --project=. experiments/ett_forecast.jl
    deps:
      - experiments/ett_forecast.jl
      - src
      - data/ett/ETTh1.csv
    params:
      - ett_forecast
    outs:
      - data/ett_forecast/comparison.json
      - data/ett_forecast/mse_vs_dropout.png
      - data/ett_forecast/mse_vs_dropout.tikz
      - data/ett_forecast/nll_vs_dropout.png
      - data/ett_forecast/nll_vs_dropout.tikz
      - data/ett_forecast/predictions_ot.png
      - data/ett_forecast/predictions_ot.tikz
      - data/ett_forecast/timing.png
      - data/ett_forecast/timing.tikz
      - data/ett_forecast/mse_vs_horizon.png
      - data/ett_forecast/mse_vs_horizon.tikz
      - data/ett_forecast/nll_vs_horizon.png
      - data/ett_forecast/nll_vs_horizon.tikz
    metrics:
      - data/ett_forecast/metrics.json:
          cache: false

  quadrature:
    cmd: julia --project=. experiments/quadrature.jl
    deps:
      - experiments/quadrature.jl
      - src
    params:
      - quadrature
    outs:
      - data/quadrature/comparison.json
      - data/quadrature/timing.png
      - data/quadrature/timing.tikz
      - data/quadrature/timelimit.png
      - data/quadrature/timelimit.tikz
    metrics:
      - data/quadrature/metrics.json:
          cache: false
