stages:
  partial_obs:
    cmd: julia --project=. experiments/partial_obs.jl
    deps:
      - experiments/partial_obs.jl
      - src
      - data/ett/ETTh1.csv
    params:
      - partial_obs
    outs:
      - data/partial_obs/comparison.json
      - data/partial_obs/time_vs_N.png
      - data/partial_obs/mnll_vs_N.png
      - data/partial_obs/mnll_vs_N.tikz
      - data/partial_obs/rmse_vs_N.png
      - data/partial_obs/rmse_vs_N.tikz
      - data/partial_obs/time_vs_p.png
      - data/partial_obs/mnll_vs_p.png
      - data/partial_obs/mnll_vs_p.tikz
      - data/partial_obs/rmse_vs_p.png
      - data/partial_obs/rmse_vs_p.tikz
    metrics:
      - data/partial_obs/metrics.json:
          cache: false

  chain_start_sensitivity:
    cmd: julia --project=. experiments/chain_start_sensitivity.jl
    deps:
      - experiments/chain_start_sensitivity.jl
      - src
      - data/ett/ETTh1.csv
    params:
      - chain_start_sensitivity
    outs:
      - data/chain_start_sensitivity/comparison.json
      - data/chain_start_sensitivity/rmse_spread_vs_C.png
      - data/chain_start_sensitivity/rmse_spread_vs_C.tikz
      - data/chain_start_sensitivity/mnll_spread_vs_C.png
      - data/chain_start_sensitivity/mnll_spread_vs_C.tikz
      - data/chain_start_sensitivity/std_vs_C.png
      - data/chain_start_sensitivity/std_vs_C.tikz
      - data/chain_start_sensitivity/metric_vs_distortion.png
      - data/chain_start_sensitivity/metric_vs_distortion.tikz
    metrics:
      - data/chain_start_sensitivity/metrics.json:
          cache: false

  chain_start_dim:
    cmd: julia --project=. experiments/chain_start_dim.jl
    deps:
      - experiments/chain_start_dim.jl
      - src
    params:
      - chain_start_dim
    outs:
      - data/chain_start_dim/comparison.json
      - data/chain_start_dim/std_vs_M.png
      - data/chain_start_dim/std_vs_M.tikz
      - data/chain_start_dim/rmse_spread_vs_M.png
      - data/chain_start_dim/rmse_spread_vs_M.tikz
    metrics:
      - data/chain_start_dim/metrics.json:
          cache: false

  quadrature:
    cmd: julia --project=. experiments/quadrature.jl
    deps:
      - experiments/quadrature.jl
      - src
    params:
      - quadrature
    outs:
      - data/quadrature/comparison.json
      - data/quadrature/timing.png
      - data/quadrature/timing.tikz
      - data/quadrature/timelimit.png
      - data/quadrature/timelimit.tikz
    metrics:
      - data/quadrature/metrics.json:
          cache: false

  dim_sweep:
    cmd: julia --project=. experiments/dim_sweep.jl
    deps:
      - experiments/dim_sweep.jl
      - src
    params:
      - dim_sweep
    outs:
      - data/dim_sweep/comparison.json
      - data/dim_sweep/rmse_vs_d.png
      - data/dim_sweep/rmse_vs_d.tikz
      - data/dim_sweep/mnll_vs_d.png
      - data/dim_sweep/mnll_vs_d.tikz
      - data/dim_sweep/time_vs_d.png
      - data/dim_sweep/time_vs_d.tikz
      - data/dim_sweep/chain_quality_vs_d.png
      - data/dim_sweep/chain_quality_vs_d.tikz
    metrics:
      - data/dim_sweep/metrics.json:
          cache: false
